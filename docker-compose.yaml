services:
  memory-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MEMORY_SERVER_BIND_ADDRESS:-127.0.0.1}:7337:7337"
    environment:
      NODE_ENV: production
      MEMORY_SERVER_HOST: 0.0.0.0
      MEMORY_SERVER_PORT: 7337
      MEMORY_SERVER_DB_PATH: /app/data/memory-server
      MEMORY_SERVER_TOKEN: "${MEMORY_SERVER_TOKEN:?set MEMORY_SERVER_TOKEN in .env}"
      MEMORY_SERVER_ALLOWED_HOSTS: "${MEMORY_SERVER_ALLOWED_HOSTS:-localhost,127.0.0.1,memory-server}"
      MEMORY_SERVER_ALLOWED_ORIGINS: "${MEMORY_SERVER_ALLOWED_ORIGINS:-localhost,127.0.0.1,memory-server}"
      MEMORY_SERVER_DEFAULT_AGENT: main
      MEMORY_SERVER_DEFAULT_WRITE_SCOPE: global
      MEMORY_CAPTURE_ENABLED: "true"
      MEMORY_EMBEDDING_BASE_URL: "${MEMORY_EMBEDDING_BASE_URL:-http://ollama:11434/v1}"
      MEMORY_EMBEDDING_API_KEY: "${MEMORY_EMBEDDING_API_KEY:-}"
      MEMORY_EMBEDDING_MODEL: "${MEMORY_EMBEDDING_MODEL:?set MEMORY_EMBEDDING_MODEL}"
      MEMORY_EMBEDDING_DIMENSIONS: "${MEMORY_EMBEDDING_DIMENSIONS:?set MEMORY_EMBEDDING_DIMENSIONS}"
      MEMORY_EMBEDDING_TIMEOUT_MS: "${MEMORY_EMBEDDING_TIMEOUT_MS:-60000}"
      MEMORY_LLM_BASE_URL: "${MEMORY_LLM_BASE_URL:-http://ollama:11434/v1}"
      MEMORY_LLM_API_KEY: "${MEMORY_LLM_API_KEY:-}"
      MEMORY_LLM_MODEL: "${MEMORY_LLM_MODEL:?set MEMORY_LLM_MODEL}"
      MEMORY_LLM_TIMEOUT_MS: "${MEMORY_LLM_TIMEOUT_MS:-180000}"
      MEMORY_LLM_THINK_LEVEL: "${MEMORY_LLM_THINK_LEVEL:-}"
    volumes:
      - agent-memory-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7337/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  agent-memory-data:
