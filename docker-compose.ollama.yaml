services:
  memory-server:
    depends_on:
      ollama-init-embed:
        condition: service_completed_successfully
      ollama-init-llm:
        condition: service_completed_successfully
    environment:
      MEMORY_EMBEDDING_BASE_URL: http://ollama:11434/v1
      MEMORY_LLM_BASE_URL: http://ollama:11434/v1

  ollama:
    image: ollama/ollama:0.34.0
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama-init-embed:
    image: ollama/ollama:0.34.0
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${MEMORY_EMBEDDING_MODEL:?set MEMORY_EMBEDDING_MODEL}"]

  ollama-init-llm:
    image: ollama/ollama:0.34.0
    restart: "no"
    depends_on:
      ollama-init-embed:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${MEMORY_LLM_MODEL:?set MEMORY_LLM_MODEL}"]

volumes:
  ollama-models:
