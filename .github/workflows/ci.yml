name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-shared-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node test/memory-server-http.test.mjs
      - run: node test/mcp-shared-memory-clients.test.mjs
      - run: node test/openclaw-remote-mode.test.mjs

  core-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:core-regression
